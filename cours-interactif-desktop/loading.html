<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cours Interactif</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #1e2a5a 0%, #0b1020 60%);
        color: #e8ecff;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 24px;
      }
      .logo {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(90deg, #8ab4ff, #c9a8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub { font-size: 14px; opacity: 0.75; max-width: 460px; line-height: 1.5; }
      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #8ab4ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { font-size: 12px; opacity: 0.5; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Cours Interactif</div>
      <div class="spinner"></div>
      <div class="sub">Démarrage du moteur de création de cours…</div>
      <div class="hint">Le premier lancement peut prendre quelques secondes.</div>
    </div>
  </body>
</html>
