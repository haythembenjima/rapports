name: Build Android APK

# Construit l'APK Android (Capacitor) et le publie dans une GitHub Release.
# Déclenché manuellement (Run workflow) avec un tag, ou par un tag « android-v* ».
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release APK (ex. android-v1.0.0)"
        required: true
        default: "android-v1.0.0"
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Fetch OCR assets (offline OCR bundled in the app)
        run: node scripts/fetch-ocr.mjs

      - name: Prepare web assets (www/)
        run: node scripts/prepare-www.mjs

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rapport-Inspection.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapport-inspection-android-apk
          path: Rapport-Inspection.apk
          if-no-files-found: error

      - name: Publish GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Rapport Inspection Android ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            **Application Android (.apk)** — Rapport d'Inspection — Gestion.

            ## Installation
            1. Téléchargez `Rapport-Inspection.apk` sur votre téléphone.
            2. Autorisez l'installation depuis des « sources inconnues » si demandé.
            3. Ouvrez le fichier pour installer.

            Mêmes fonctionnalités que les versions web/PC : saisie du rapport,
            note /20, synthèse, export PDF/Word, notes manuscrites (en ligne et
            hors-ligne via la banque), historique.
          files: Rapport-Inspection.apk
          draft: false
          prerelease: true
